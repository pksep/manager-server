# У сервиса нет публичного порта: внешний трафик допускается только через этот шлюз.
# TLS завершает доверенный балансировщик, который ПЕРЕЗАПИСЫВАЕТ X-Forwarded-For.
# Заменить пример 10.20.0.0/24 на точные адреса своего балансировщика; доступ к 8080 только от него.
worker_processes auto;
events { worker_connections 1024; }
http {
  server_tokens off;
  set_real_ip_from 10.20.0.0/24;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;
  limit_req_zone $binary_remote_addr zone=manager_requests:10m rate=10r/s;
  limit_conn_zone $binary_remote_addr zone=manager_connections:10m;
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  server {
    listen 8080;
    client_max_body_size 21m;
    client_header_timeout 10s;
    client_body_timeout 30s;
    send_timeout 30s;
    limit_req_status 429;
    limit_conn_status 429;
    location /v1/widget/ {
      limit_req zone=manager_requests burst=30 nodelay;
      limit_conn manager_connections 30;
      proxy_pass http://manager:4314;
      proxy_http_version 1.1;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header Host $host;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_connect_timeout 3s;
      proxy_send_timeout 30s;
      proxy_read_timeout 65s;
      proxy_request_buffering off;
    }
    location / { return 404; }
  }
}
